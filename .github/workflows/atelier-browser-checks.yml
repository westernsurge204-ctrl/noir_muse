name: Private Atelier browser checks
on:
  pull_request:
    paths:
      - 'atelier-preview.html'
      - 'atelier-mix-match.js'
      - 'atelier-migration.js'
      - 'atelier-gallery.js'
      - 'tests/atelier/**'
      - 'playwright.atelier.config.cjs'
      - 'package.json'
      - '.github/workflows/atelier-browser-checks.yml'
  workflow_dispatch:
jobs:
  playwright:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile Chromium tests
        run: npm run test:atelier
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
